# Проверки на домашнем Gitea. Копия .github/workflows/ci.yml, отличие одно: задачи
# идут на раннер ПК (метка windows), а не на windows-latest / ubuntu-latest - такие метки
# есть только у раннера ноутбука, и без него задачи висели в очереди и отменялись.
# Раз папка .gitea/workflows есть, Gitea берёт проверки только отсюда: выпуски и Pages -
# дело GitHub, здесь их нет. Меняя проверки, править оба файла.

# Проверки на каждый пуш.
#
# Раннер windows: программа под Windows, и часть проверок держится за её
# правила - имя файла без учёта регистра, запрещённые в имени символы, буква
# диска. Окна тестов поднимаются сами с QT_QPA_PLATFORM=offscreen.
#
# Снимок настоящей раскладки (tests/test_real_layout_snapshot.py) здесь
# пропускается: он снят с личной папки загрузок автора и в открытый
# репозиторий не входит.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Проверки
    runs-on: windows
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Python ПК (3.13) в своём окружении, а не setup-python: тот ставит Python
      # установщиком, которому нужны права администратора на реестр, - у раннера их нет.
      - name: Python в отдельном окружении
        run: |
          py -3.13 -m venv .ci-venv
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$((Resolve-Path .ci-venv).Path)\Scripts`n")

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты и свойства
        run: python -m pytest -q
